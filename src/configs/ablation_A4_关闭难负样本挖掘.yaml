# ============================================================================
# 消融实验 A4：关闭难负样本挖掘（Hard Negative Mining）
#
# 这一项论文没有做（属于我们的补充实验）。
# 官方 mining_type = MAX_NEGATIVE：按置信度损失降序，每张图只取
#   min(正样本数 × 3, 合格负样本数) 个负样本参与分类损失。
# SSD 中负样本数量是正样本的数百倍，不做挖掘会让大量「已经分对」的简单负样本
# 淹没梯度，这是单阶段检测器（以及后来的 Focal Loss）的核心问题。
#
# 本配置把所有合格负样本都计入分类损失，用来验证挖掘的必要性。
#
# 运行： ./env_ssd/bin/python -m src.train --config src/configs/ablation_A4_关闭难负样本挖掘.yaml
# ============================================================================
_base: ssd300_voc_quick.yaml

loss:
  mining_type: "none"    # 关闭难负样本挖掘
  # 关闭挖掘后负样本从 ~500 涨到 ~13 万，若仍按官方方式除以「正样本数」，
  # 分类损失会放大约 50 倍直接发散。这里改为按分类样本自身数量归一化，
  # 使损失量级与基线可比 —— 这样消融隔离出的才是「挖掘」本身的影响。
  normalize_conf_by_samples: true

# 【可选实验】想缩短预算就在下面取消注释（4 组要用同一个数字才可比）：
# solver:
#   max_iter: 4000

runtime:
  exp_name: "A4_关闭难负样本挖掘"
