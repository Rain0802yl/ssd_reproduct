# ============================================================================
# SSD300 + VOC2007 长训练配置：15000 迭代（约 8.8 小时）
#
# 与快速验证档（8000 迭代）只差 max_iter：
# 学习率里程碑由 scale_milestones 自动按官方比例 [80k,100k,120k] 缩放，
# 即 [10000, 12500, 15000]。
#
# 预期 mAP 约 45%~55%（快速验证档约 35%~50%）。
#
# 想换成别的迭代数？只改下面一行 max_iter 即可，里程碑会自动重新缩放。
#   12000 迭代 -> 约 7.0 小时
#   15000 迭代 -> 约 8.8 小时  （当前）
#   20000 迭代 -> 约 11.7 小时
#
# 运行： 脚本/05_训练_长训练.sh
# 中断续训：脚本/02_继续训练.sh long15000
# ============================================================================
_base: ssd300_voc_quick.yaml

solver:
  max_iter: 15000

runtime:
  exp_name: "long15000"
  snapshot_interval: 3000      # 快照间隔（便于断点续训）
