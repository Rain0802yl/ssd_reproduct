# ============================================================================
# 消融实验 A2：移除多形状先验框
#
# 对应论文 Table 2 的 "include {1/2, 2} box?" 与 "include {1/3, 3} box?" 两行
# （论文中两项分别贡献 +2.1% 与 +0.6% mAP）。
# 官方 aspect_ratios = [[2], [2,3], [2,3], [2,3], [2], [2]]，配合 flip=True 会
# 额外生成 1/2 与 1/3 的框；本配置把长宽比清空，每个位置只剩
# 「min_size 正方形 + sqrt(min*max) 正方形」两个框。
#
# 注意：先验框数量从 8732 降到 3880。网络预测头会自动与之一致（已验证）。
#
# 运行： ./env_ssd/bin/python -m src.train --config src/configs/ablation_A2_无多形状先验框.yaml
# ============================================================================
_base: ssd300_voc_quick.yaml

model:
  aspect_ratios: [[], [], [], [], [], []]

# 【可选实验】想缩短预算就在下面取消注释（4 组要用同一个数字才可比）：
# solver:
#   max_iter: 4000

runtime:
  exp_name: "A2_无多形状先验框"
