# ============================================================================
# 消融实验 A3：只用 conv4_3 + conv7 两层做预测
#
# 对应论文 Table 3 "Effects of using multiple output layers"。
# 官方用 6 个不同分辨率的层（38/19/10/5/3/1），论文中删到只剩两层时
# mAP 从 74.3 掉到 64.2（约 -10 个点），说明「多尺度预测」是 SSD 的核心。
#
# 本配置保留第 0 层 conv4_3(38x38) 与第 1 层 conv7(19x19)，先验框 7942 个。
# 说明：论文为了公平比较会把框重新排布以维持 ~8732 个；这里采用简化版
#      （直接用两层的原生框数），结论方向一致。
#
# 运行： ./env_ssd/bin/python -m src.train --config src/configs/ablation_A3_仅两层预测.yaml
# ============================================================================
_base: ssd300_voc_quick.yaml

model:
  prediction_layers: [0, 1]

# 【可选实验】想缩短预算就在下面取消注释（4 组要用同一个数字才可比）：
# solver:
#   max_iter: 4000

runtime:
  exp_name: "A3_仅两层预测"
